# Prometheus Configuration for FinGuru
# This file configures Prometheus to scrape metrics from FinGuru

global:
  scrape_interval: 15s  # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate rules
  external_labels:
    cluster: 'finguru-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # FinGuru application metrics
  - job_name: 'finguru'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'finguru:8000'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'finguru-api'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # Node exporter for system metrics (optional)
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  # Docker container metrics (optional)
  - job_name: 'docker'
    static_configs:
      - targets:
          - 'cadvisor:8080'
