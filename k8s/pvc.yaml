apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finguru-data-pvc
  namespace: finguru
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finguru-logs-pvc
  namespace: finguru
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
