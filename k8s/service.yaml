apiVersion: v1
kind: Service
metadata:
  name: finguru
  namespace: finguru
  labels:
    app: finguru
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: finguru
  sessionAffinity: None
