# Non-secret configuration only.
#
# Nothing here may hold a credential. `JWT_SECRET`, `FIELD_ENCRYPTION_KEY`,
# `AA_WEBHOOK_SECRET`, `GROQ_API_KEY` and both database URLs carry secrets and
# belong in the `finguru-secrets` Secret, mounted via `envFrom`. A ConfigMap is
# readable by anything with namespace read access, which is a much wider set of
# principals than it first appears.
apiVersion: v1
kind: ConfigMap
metadata:
  name: finguru-config
  namespace: finguru
data:
  APP_NAME: "FinGuru"
  APP_VERSION: "3.0.0"
  ENVIRONMENT: "production"
  DEBUG: "False"
  LOG_LEVEL: "INFO"

  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # Multi-replica deployment: the in-process fallback would give every pod its
  # own token denylist, so a token revoked on pod A would still authenticate on
  # pod B. Fail to start rather than degrade silently.
  REDIS_REQUIRED: "true"

  # Connection pool per pod. Multiply by replica count and stay under the
  # server's max_connections; put PgBouncer in transaction mode in front if
  # that gets tight.
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"

  # Keep three months of transaction partitions ahead of now. A missed run
  # degrades to rows landing in the DEFAULT partition, not to failed inserts.
  TXN_PARTITION_LOOKAHEAD_MONTHS: "3"

  ACCESS_TOKEN_TTL_SECONDS: "900"
  REFRESH_TOKEN_TTL_SECONDS: "1209600"
  AUTH_MAX_FAILED_ATTEMPTS: "5"
  AUTH_LOCKOUT_SECONDS: "900"
  AUTH_RATE_LIMIT_PER_MINUTE: "10"
  GENERAL_RATE_LIMIT_PER_MINUTE: "60"

  # Argon2id at 64 MiB per hash. That is a real memory cost, not a tuning
  # nicety: concurrent logins each hold it simultaneously, so container memory
  # limits must account for it.
  ARGON2_MEMORY_COST: "65536"
  ARGON2_TIME_COST: "3"
  ARGON2_PARALLELISM: "4"

  MFA_REQUIRED_FOR_BANK_LINKAGE: "true"

  # Account Aggregator. AA_USE_MOCK_TRANSPORT must be false in production --
  # `validate_production_settings()` refuses to start otherwise, because a
  # deployment silently serving simulated bank data is worse than one that
  # does not start at all.
  AA_ENABLED: "true"
  AA_PROVIDER: "setu"
  AA_USE_MOCK_TRANSPORT: "false"
  AA_SANDBOX_ONLY: "true"
  AA_BASE_URL: "https://fiu-sandbox.setu.co"
  AA_FIU_ID: "finguru-sandbox"

  MODEL_REGISTRY_DIR: "/app/data/models"
  CATEGORIZER_CONFIDENCE_FLOOR: "0.45"
  CATEGORIZER_MIN_MACRO_F1: "0.80"
  PSI_ALERT_THRESHOLD: "0.2"
  PSI_RETRAIN_THRESHOLD: "0.25"

  LLM_REDACTION_ENABLED: "true"
  LLM_INJECTION_DEFENCE_ENABLED: "true"
  LLM_FAIL_CLOSED_ON_REDACTION_ERROR: "true"
  LLM_USER_DAILY_TOKEN_BUDGET: "50000"
  LLM_MAX_CONTEXT_TRANSACTIONS: "25"

  # Explicit origins. "*" with credentials is rejected by browsers anyway, and
  # startup validation refuses it in production.
  CORS_ALLOW_ORIGINS: "https://app.finguru.example"

  MAX_FILE_SIZE_MB: "10"
  ALLOWED_FILE_TYPES: "csv"
