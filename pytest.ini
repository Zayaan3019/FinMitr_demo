# Pytest configuration.
#
# Note the section name: `[pytest]`, not `[tool:pytest]`. The previous file
# used the latter, which is only recognised in setup.cfg -- so in pytest.ini it
# was silently ignored and none of the settings below (including
# --strict-markers) were ever in effect.

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# ---------------------------------------------------------------------------
# asyncio
# ---------------------------------------------------------------------------
# A session-scoped loop is required for correctness here, not a style choice.
# The application holds one process-wide asyncpg pool, and an asyncpg
# connection is bound to the loop that created it. Under the default
# function-scoped loop the first test opens a pooled connection on loop A, the
# second borrows it on loop B, and asyncpg raises "attached to a different
# loop" during teardown. One loop per session also matches how the application
# actually runs.
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session

markers =
    db: requires a live PostgreSQL (docker compose up -d postgres redis)
    slow: slow test (model training, load generation)
    integration: crosses component boundaries
    unit: fast and isolated

addopts =
    -ra
    --strict-markers
    --strict-config

[coverage:run]
source = app
omit =
    */tests/*
    */.venv/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
