# Pytest Configuration

[tool:pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require dependencies)
    slow: Slow tests (deselect with '-m "not slow"')
    api: API endpoint tests
    agents: Agent workflow tests

# Output options
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals

# Coverage options
[coverage:run]
source = app
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
